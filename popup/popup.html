<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glance Status</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-wrapper">
        <svg class="logo-svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
          <path d="M11 2 A10 10 0 0 0 11 22 Z" />
          <path d="M13 12 L23 12 A10 10 0 0 1 13 22 Z" />
        </svg>
        <span class="app-name">Glance</span>
      </div>
      <div class="status-badge" id="status-badge">active</div>
    </header>

    <!-- Main controls -->
    <main class="main-content">
      <!-- Toggle Card 1: Global State -->
      <div class="control-card">
        <div class="control-info">
          <span class="control-label">Link Previews</span>
          <span class="control-desc">Enable hover cards globally</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="global-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>

      <!-- Toggle Card 2: Current Domain State -->
      <div class="control-card" id="site-card">
        <div class="control-info">
          <span class="control-label">This Website</span>
          <span class="control-desc" id="site-desc">Loading website details...</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="site-toggle" checked disabled>
          <span class="slider"></span>
        </label>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="current-site-info">
        <span class="status-dot" id="status-dot"></span>
        <span class="domain-text" id="domain-text">unknown</span>
      </div>
      <button class="settings-btn" id="settings-btn" title="Open Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
